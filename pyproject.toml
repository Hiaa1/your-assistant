[project]
name = "your-assistant"
version = "0.1.0"
description = "A personal assistant with reviewable memory and human-approved actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "jieba>=0.42.1,<1",
    "jinja2>=3.1,<4",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.scripts]
your-assistant = "your_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/your_assistant"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"